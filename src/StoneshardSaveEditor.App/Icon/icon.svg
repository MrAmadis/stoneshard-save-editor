<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- The app icon from 32 px up: a rune crystal floating in a gold spell circle.
       An original drawing in the spirit of the game's crystal; no game art. tools/make-icon.ps1 turns it into app.ico. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="0.45" stop-color="#f2c15a"/>
      <stop offset="1" stop-color="#a8701f"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.4" stop-color="#b07cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b07cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ecff"/>
      <stop offset="1" stop-color="#c39cff"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfa9ff"/>
      <stop offset="1" stop-color="#8b50ea"/>
    </linearGradient>
    <linearGradient id="leftBevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b585ff"/>
      <stop offset="1" stop-color="#5b25b0"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8445e6"/>
      <stop offset="1" stop-color="#3f1488"/>
    </linearGradient>
    <linearGradient id="rightBevel" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a3fd0"/>
      <stop offset="1" stop-color="#34107a"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5420ad"/>
      <stop offset="1" stop-color="#21074e"/>
    </linearGradient>
    <radialGradient id="glint" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="spark" d="M0 -10 L2.4 -2.4 L10 0 L2.4 2.4 L0 10 L-2.4 2.4 L-10 0 L-2.4 -2.4 Z"/>

    <!-- The crystal, drawn in a 256 box around (128, 131): a cube with bevelled faces and carved runes. -->
    <g id="crystal">
      <path d="M128 30 L214 80 L128 130 L42 80 Z" fill="url(#topBevel)"/>
      <path d="M42 80 L128 130 L128 232 L42 182 Z" fill="url(#leftBevel)"/>
      <path d="M128 130 L214 80 L214 182 L128 232 Z" fill="url(#rightBevel)"/>
      <path d="M128 40 L196.8 80 L128 120 L59.2 80 Z" fill="url(#topFace)"/>
      <path d="M50.6 95.2 L119.4 135.2 L119.4 216.8 L50.6 176.8 Z" fill="url(#leftFace)"/>
      <path d="M136.6 135.2 L205.4 95.2 L205.4 176.8 L136.6 216.8 Z" fill="url(#rightFace)"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g transform="matrix(0.86,0.5,0,1.02,42,80)">
          <path d="M50 24 V78 M50 46 L32 28 M50 46 L68 28" stroke="#c7a4ff" stroke-opacity="0.35" stroke-width="9" transform="translate(1.5,2)"/>
          <path d="M50 24 V78 M50 46 L32 28 M50 46 L68 28" stroke="#22064b" stroke-opacity="0.85" stroke-width="8"/>
        </g>
        <g transform="matrix(0.86,-0.5,0,1.02,128,130)">
          <path d="M38 24 V78 M38 24 L62 39 L38 52 L64 78" stroke="#a983f0" stroke-opacity="0.3" stroke-width="9" transform="translate(1.5,2)"/>
          <path d="M38 24 V78 M38 24 L62 39 L38 52 L64 78" stroke="#14033a" stroke-opacity="0.85" stroke-width="8"/>
        </g>
        <g transform="matrix(0.86,0.5,-0.86,0.5,128,30)">
          <circle cx="50" cy="50" r="15" stroke="#6f3cc6" stroke-opacity="0.8" stroke-width="7"/>
        </g>
      </g>
      <path d="M42 80 L128 130 L214 80 M128 130 V232" fill="none" stroke="#f1e4ff" stroke-opacity="0.75" stroke-width="3"/>
      <path d="M50 92 L54 176" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
      <circle cx="128" cy="130" r="40" fill="url(#glint)" opacity="0.55"/>
      <path d="M128 30 L214 80 L214 182 L128 232 L42 182 L42 80 Z" fill="none" stroke="#150430" stroke-width="5" stroke-linejoin="round"/>
    </g>
  </defs>

  <circle cx="128" cy="128" r="92" fill="url(#aura)"/>

  <!-- a dark edge under the gold, so the ring holds up on light backgrounds -->
  <g fill="none" stroke="#4a2c08">
    <circle cx="128" cy="128" r="110" stroke-width="13" stroke-opacity="0.9"/>
    <circle cx="128" cy="128" r="93" stroke-width="6" stroke-opacity="0.6"/>
  </g>

  <g filter="url(#glow)" fill="none" stroke="url(#gold)">
    <circle cx="128" cy="128" r="110" stroke-width="8"/>
    <circle cx="128" cy="128" r="93" stroke-width="3"/>
  </g>
  <g stroke="#f2c15a" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <path d="M225 128 H234 M176.5 212 L181 219.8 M79.5 212 L75 219.8 M31 128 H22 M79.5 44 L75 36.2 M176.5 44 L181 36.2"/>
  </g>
  <g fill="#ffe08f" stroke="#7a4a12" stroke-width="1.5">
    <circle cx="128" cy="18" r="6"/>
    <circle cx="223.3" cy="73" r="6"/>
    <circle cx="223.3" cy="183" r="6"/>
    <circle cx="128" cy="238" r="6"/>
    <circle cx="32.7" cy="183" r="6"/>
    <circle cx="32.7" cy="73" r="6"/>
  </g>

  <use href="#crystal" transform="translate(43.5,41.5) scale(0.66)"/>

  <g fill="#fff3c9" filter="url(#glow)">
    <use href="#spark" transform="translate(196,50) scale(1.1)"/>
    <use href="#spark" transform="translate(60,206) scale(0.75)"/>
  </g>
</svg>
